<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Qi Zhang</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem("qz_homepage_theme");
      } catch (_) {}
      var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
    }
    .not-found-card {
      max-width: 420px;
    }
    .not-found-code {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .not-found h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      margin: 0 0 12px;
    }
    .not-found p {
      color: var(--text-secondary);
      margin: 0 0 24px;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-card">
      <div class="not-found-code">404 · ORBIT NOT FOUND</div>
      <h1>Page not found</h1>
      <p>The requested page does not exist or has moved to the main academic homepage.</p>
      <a class="link-pill" href="/">← Back to Homepage</a>
    </div>
  </main>
</body>
</html>
